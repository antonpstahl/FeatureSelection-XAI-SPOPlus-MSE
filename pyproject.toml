[project]
name = "featureselection-xai-spoplus-mse"
version = "0.1.0"
description = "Feature importance under prediction loss (MSE) vs. decision loss (SPO+) in predict-then-optimize"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "gurobipy>=13.0,<14",  # local academic license is for Gurobi 13
    "matplotlib>=3.10",
    "numpy>=2.4",
    "pandas>=3.0",
    "pyepo>=2.2.7",
    "scipy>=1.17",
    "torch>=2.12",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0",
    "jupyterlab>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/prestudy.py"]
sources = ["src"]
